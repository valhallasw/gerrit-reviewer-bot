[mypy]
python_version = 3.13
# Third-party libraries without type stubs (e.g. lxml, poplib internals).
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
# config.py is created at deploy time from config.py.example and is not present
# in CI; it is imported lazily inside functions.
[mypy-config]
ignore_missing_imports = True
